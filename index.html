<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive dashboard tracking Ostaslaufa cheese pastry ratings across Icelandic grocery stores." />
    <title>Ostaslaufa Rating Dashboard</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('osta-theme');
          var d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches) || t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
